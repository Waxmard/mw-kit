name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --locked

      # Lint + typecheck + tests (mirrors `make ci`)
      - run: make ci

      # MANIFEST.md is generated from page frontmatter — fail if it's stale.
      - name: manifest is committed in sync
        run: |
          python3 scripts/build_manifest.py
          git diff --exit-code playbook/MANIFEST.md
